# Pre-push gates. Every one of these must pass before a commit reaches main.
#
# The order is deliberate. A credential leak is the worst outcome available and
# the only one no later gate would catch, so the secret scan runs first. After
# that the cheap structural checks run, so an obviously wrong tree fails in a
# second rather than after a full typecheck.
pre-push:
  parallel: false
  commands:
    # First, and self-testing: the scanner proves it still separates known-bad
    # from known-good fixtures before it is trusted with the real tree.
    secrets:
      run: pnpm run check:secrets

    secrets-self-test:
      run: pnpm run check:secrets:self-test

    # Backend structure: kebab-case names, a domain index.ts, a helpers
    # barrel, and named exports so a domain's surface is readable. The glob
    # covers every backend root the gate checks, so a structural change in
    # apps/api or lib fails here rather than waiting for a later reader.
    naming:
      glob: "{packages/*/src/**/*.ts,apps/api/src/**/*.ts,lib/**/*.ts}"
      run: pnpm run check:naming

    convex-naming:
      glob: "{convex/**/*.ts,docs/convex-naming-conventions.md}"
      run: pnpm run check:convex

    env-manifest:
      glob: "{config/env-vars.json,packages/**/*.ts,apps/**/*.ts,convex/**/*.ts}"
      run: pnpm run check:env

    brand-no-emoji:
      run: pnpm run check:no-emoji

    brand-no-font-mono:
      run: pnpm run check:no-font-mono

    encoding-no-mojibake:
      run: pnpm run check:encoding

    typecheck:
      run: pnpm run typecheck

    # Convex lint. Runs after typecheck rather than with the cheap structural
    # gates because two of the plugin's rules (explicit-table-ids and
    # no-collect-in-query) need TypeScript type information, so a type error in
    # the backend should be reported as such rather than as a lint failure.
    lint:
      run: pnpm run lint

    test:
      run: pnpm run test
